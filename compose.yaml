services:
  yahoo-auctions-api:
    build:
      context: ../yahoo_auctions
      dockerfile: Dockerfile
    expose:
      - "8080"
    restart: unless-stopped

  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_ENDPOINT=http://yahoo-auctions-api:8080
      - CONFIG_PATH=/app/config.yaml
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - yahoo-auctions-api
    restart: unless-stopped
