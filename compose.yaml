services:
  yahoo-auctions-api:
    build:
      context: ../yahoo_auctions
      dockerfile: Dockerfile
    expose:
      - "8080"
    restart: unless-stopped

  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - API_ENDPOINT=http://yahoo-auctions-api:8080
      - CONFIG_PATH=/app/config.yaml
      - DB_PATH=/app/data/watch.db
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-5}
      - POLL_DELAY_MS=${POLL_DELAY_MS:-2000}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - bot-data:/app/data
    depends_on:
      - yahoo-auctions-api
    restart: unless-stopped

volumes:
  bot-data:
