services:
  yahoo-auctions-api:
    image: ghcr.io/jo3qma/yahoo_auctions_api
    expose:
      - "8080"
    restart: unless-stopped

  rqlite:
    image: rqlite/rqlite:8.28.2
    volumes:
      - rqlite-data:/rqlite/file
    environment:
      - NODE_ID=1
    expose:
      - "4001"
    restart: unless-stopped

  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - API_ENDPOINT=${API_ENDPOINT}
      - CONFIG_PATH=/app/config.yaml
      - RQLITE_URL=http://rqlite:4001
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-5}
      - POLL_DELAY_MS=${POLL_DELAY_MS:-2000}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - yahoo-auctions-api
      - rqlite
    restart: unless-stopped

volumes:
  rqlite-data:
