services:
  yahoo-auctions-api:
    image: ghcr.io/jo3qma/yahoo_auctions_api
    expose:
      - "8080"
    restart: unless-stopped

  rqlite:
    image: rqlite/rqlite:8.28.2
    volumes:
      - rqlite-data:/rqlite/file
    environment:
      - NODE_ID=1
    expose:
      - "4001"
    restart: unless-stopped

  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - GEMINI_MODEL_VISION=${GEMINI_MODEL_VISION:-}
      - GEMINI_MODEL_AGENT=${GEMINI_MODEL_AGENT:-}
      - GEMINI_MAX_IMAGES=${GEMINI_MAX_IMAGES:-3}
      - GEMINI_MAX_SEARCH_CALLS=${GEMINI_MAX_SEARCH_CALLS:-3}
      - GEMINI_PIPELINE_TIMEOUT_SEC=${GEMINI_PIPELINE_TIMEOUT_SEC:-45}
      - API_ENDPOINT=${API_ENDPOINT:-http://yahoo-auctions-api:8080}
      - CONFIG_PATH=/app/config.yaml
      - RQLITE_URL=http://rqlite:4001
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-5}
      - POLL_DELAY_MS=${POLL_DELAY_MS:-2000}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - yahoo-auctions-api
      - rqlite
    restart: unless-stopped

volumes:
  rqlite-data:
